[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "k-dash"
version = "0.1.0"
description = "Content-addressed OCI distribution for TVM-FFI CUDA kernels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "apache-tvm-ffi>=0.1.9,<0.2",
  "jsonschema>=4.23,<5",
  "pyelftools>=0.31,<1",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "rfc8785>=0.1.4,<0.2",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
build = ["docker>=7.1,<8"]
test = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]

[project.scripts]
k-dash = "k_dash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k_dash"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
