name: Publish wheel to PyPI

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release tag
        run: |
          tag=$(git describe --tags --exact-match --match 'v[0-9]*')
          test "$tag" = "$GITHUB_REF_NAME"
          echo "Building $tag"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel
        run: python -m build --wheel
      - name: Check wheel metadata and version
        run: |
          python -m twine check --strict dist/*.whl
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          name, version, _, _ = parse_wheel_filename(wheels[0].name)
          assert name == 'k-dash', name
          assert version == Version(os.environ['GITHUB_REF_NAME'][1:]), version
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/k-dash/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
